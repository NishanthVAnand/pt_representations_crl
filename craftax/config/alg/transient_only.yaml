ALG_NAME: "pqn_pt_craftax_transient_only"
TOTAL_TIMESTEPS: 2.5e8
TOTAL_TIMESTEPS_DECAY: 5e8 # will be used for decay functions, in case you want to test for less timesteps and keep decays same
NUM_ENVS: 1024 # parallel environments
NUM_STEPS: 32 # steps per environment in each permanent update
EPS_START: 0.1
EPS_FINISH: 0.005
EPS_DECAY: 0.2
REW_SCALE: 1.
GAMMA: 0.99

# env specific
ENV_NAME: "Craftax-Classic-Symbolic-v1"
USE_OPTIMISTIC_RESETS: True
OPTIMISTIC_RESET_RATIO: 16
LOG_ACHIEVEMENTS: True

# hashing specific
NUM_HASHES: 2
TRANSIENT_TABLE_SIZE: 2048
NUM_SLOTS: 32
NUM_ROWS: 128
CROP_SIZE: 7
LAMBDA_WT: 0.85
TRANSIENT_LR: 1.3
DECAY: 0.95

# evaluation
WANDB_LOG_INTERVAL: 10 # not log each interval since would be too much with this config
TEST_DURING_TRAINING: False 
TEST_INTERVAL: 0.01 # in terms of total updates
TEST_NUM_ENVS: 512
TEST_NUM_STEPS: 10000
EPS_TEST: 0.00 # 0 for greedy policy