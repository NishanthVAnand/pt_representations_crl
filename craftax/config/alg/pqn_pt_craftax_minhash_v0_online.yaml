ALG_NAME: "pqn_pt_craftax_minhash_online"
TOTAL_TIMESTEPS: 5e7
TOTAL_TIMESTEPS_DECAY: 5e8 # will be used for decay functions, in case you want to test for less timesteps and keep decays same
NUM_ENVS: 1 # parallel environments
NUM_STEPS: 32 # steps per environment in each permanent update
EPS_START: 0.1
EPS_FINISH: 0.005
EPS_DECAY: 0.2
NUM_MINIBATCHES: 8 # minibatches per epoch
NUM_EPOCHS: 1 # minibatches per epoch
NORM_INPUT: True
NORM_TYPE: "layer_norm" # layer_norm or batch_norm
HIDDEN_SIZE: 1024
NUM_LAYERS: 4
LR: 0.0001
MAX_GRAD_NORM: 1.0
LR_LINEAR_DECAY: True
REW_SCALE: 1.
GAMMA: 0.99
Q_LAMBDA: False
LAMBDA: 0

# env specific
ENV_NAME: "Craftax-Classic-Symbolic-v1"
USE_OPTIMISTIC_RESETS: True
OPTIMISTIC_RESET_RATIO: 16
LOG_ACHIEVEMENTS: True

# hashing specific
NUM_HASHES: 2
TRANSIENT_TABLE_SIZE: 2048
NUM_SLOTS: 32
NUM_ROWS: 128
CROP_SIZE: 7
LAMBDA_WT: 0.85
TRANSIENT_LR: 0.9
DECAY: 0.95

# evaluation
WANDB_LOG_INTERVAL: 500 # not log each interval since would be too much with this config
TEST_DURING_TRAINING: False 
TEST_INTERVAL: 0.01 # in terms of total updates
TEST_NUM_ENVS: 512
TEST_NUM_STEPS: 10000
EPS_TEST: 0.00 # 0 for greedy policy

CHECKPOINT_INTERVAL: 2500
WANDB_RUN_ID: "txl191cg"
RESUME_FROM_CHECKPOINT_DIR: "/projects/aip-dprecup/nish127/purejaxql/purejaxql/wandb/offline-run-20251116_143235-txl191cg/files/checkpoints/"
